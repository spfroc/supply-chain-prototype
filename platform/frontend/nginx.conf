server {
  listen 80;
  server_name _;
  charset utf-8;
  client_max_body_size 20m;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

  location = / { return 302 /web/; }
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location ^~ /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
  }
  location ^~ /web/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /web/index.html;
  }
  location ^~ /h5/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /h5/index.html;
  }
  location = /api/admin/business/products/collect {
    proxy_pass http://api:8080/api/admin/business/products/collect;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }
  location ^~ /api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
