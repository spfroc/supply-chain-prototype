upstream supply_chain_frontend {
    server supply-chain-frontend:80;
    keepalive 16;
}

server {
    listen 80;
    server_name supply.comp;

    client_max_body_size 20m;
    access_log /var/log/nginx/supply-chain-access.log;
    error_log /var/log/nginx/supply-chain-error.log;

    location = /api/admin/business/products/collect {
        proxy_pass http://supply_chain_frontend;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
    location / {
        proxy_pass http://supply_chain_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
